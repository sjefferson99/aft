version: 2
updates:
  # Python dependencies. /server and /ui-tests share pins (pytest, requests),
  # so they are watched together and one grouped PR bumps both files.
  - package-ecosystem: "pip"
    directories:
      - "/server"
      - "/ui-tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    # Group non-security updates together
    groups:
      python-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "flask"
          - "sqlalchemy"
        update-types:
          - "minor"
          - "patch"

  # Docker base images (server/Dockerfile and server/Dockerfile.nginx)
  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"

  # MySQL and Redis images in compose.yml and compose.example.yml. A MySQL
  # bump upgrades the data directory, so treat it as an upgrade-note PR.
  # MySQL stays on the 9.7 LTS line (#609): the year-numbered releases
  # (26.x) are Innovation releases that need a one-way upgrade every quarter.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    ignore:
      - dependency-name: "mysql"
        versions: [">= 9.8"]

  # Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

# Development compose file — builds images from local source.
# Use this when developing locally:
#
#   docker compose up --build
#
# Security Note: This stack should be deployed together as a single unit.
# Internal services (Redis, Database) are not exposed externally and rely on
# container-to-container communication within the aft network. Splitting services
# across hosts or exposing internal services would require additional security
# measures (authentication, encryption, network isolation).

services:
  db:
    image: mysql:9.5.0
    container_name: aft-db
    restart: unless-stopped
    # MySQL memory tuning, defaulted for small self-hosted installs. Each value can be
    # overridden in .env with the MYSQL_* variable shown; see the administration guide:
    # https://github.com/sjefferson99/aft/blob/main/www/docs/administration.md#database-memory-tuning
    command:
      - --max_allowed_packet=${MYSQL_MAX_ALLOWED_PACKET:-128M}
      - --performance_schema=${MYSQL_PERFORMANCE_SCHEMA:-OFF}
      - --innodb_buffer_pool_size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-32M}
      - --innodb_log_buffer_size=${MYSQL_INNODB_LOG_BUFFER_SIZE:-4M}
      - --table_open_cache=${MYSQL_TABLE_OPEN_CACHE:-200}
      - --max_connections=${MYSQL_MAX_CONNECTIONS:-100}
    env_file: .env
    security_opt:
      - no-new-privileges:true
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./data:/var/lib/mysql
    networks:
      - aft

  redis:
    image: redis:7-alpine
    container_name: aft-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - aft
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: aft-server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      # The test suites make all their requests from one IP, so raise the
      # per-IP limits here. Per-account limits stay at their defaults.
      - AUTH_RATE_LIMIT_IP_FAILURES=${AUTH_RATE_LIMIT_IP_FAILURES:-100000}
      - AUTH_RATE_LIMIT_REGISTRATIONS=${AUTH_RATE_LIMIT_REGISTRATIONS:-100000}
      - AUTH_RATE_LIMIT_PASSKEY_STARTS=${AUTH_RATE_LIMIT_PASSKEY_STARTS:-100000}
    depends_on:
      - db
      - redis
    volumes:
      - ./backups:/app/backups
      - backgrounds_volume:/var/www/images/backgrounds
    networks:
      - aft
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; req = urllib.request.Request('http://localhost:5000/api/health/ready', headers={'X-Health-Token': os.environ.get('HEALTHCHECK_TOKEN', '')}); urllib.request.urlopen(req).read()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 40s

  nginx:
    build:
      context: .
      dockerfile: server/Dockerfile.nginx
    container_name: aft-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      # Keep explicit passthrough so custom compose overrides do not accidentally
      # drop EMBED_ALLOWED_ORIGINS from the nginx runtime environment.
      - EMBED_ALLOWED_ORIGINS=${EMBED_ALLOWED_ORIGINS}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./www:/usr/share/nginx/html
      - ./server/nginx.conf:/etc/nginx/conf.d/default.conf
      - backgrounds_volume:/usr/share/nginx/html/images/backgrounds
    networks:
      - aft

networks:
  aft:
    driver: bridge

volumes:
  backgrounds_volume:
    driver: local
# Uses pre-built images from GitHub Container Registry — no build step needed.
# Copy this file to compose.yml on your server alongside a .env file (use .env.example as a
# starting point: curl -O .../raw/.../main/.env.example && mv .env.example .env)
# then run:
#
#   docker compose pull
#   docker compose up -d
#
# Images are tagged :latest (tracks the most recent release) and also by semver
# (e.g. :1.2.0). Pin to a semver tag for fully reproducible deployments.
#
# Required .env variables:
#   MYSQL_ROOT_PASSWORD, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD
#   HEALTHCHECK_TOKEN, SECRET_KEY, and any other app env vars
#
# To deploy server + UI:  use the nginx service (enabled by default)
# To deploy server only:  comment out or remove the nginx service

services:
  db:
    image: mysql:9.5.0
    container_name: aft-db
    restart: unless-stopped
    command: --max_allowed_packet=128M
    env_file: .env
    security_opt:
      - no-new-privileges:true
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./data:/var/lib/mysql
    networks:
      - aft

  redis:
    image: redis:7-alpine
    container_name: aft-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - aft
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    image: ghcr.io/sjefferson99/aft:latest
    container_name: aft-server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - ./backups:/app/backups
      - backgrounds_volume:/var/www/images/backgrounds
    networks:
      - aft
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; req = urllib.request.Request('http://localhost:5000/api/health/ready', headers={'X-Health-Token': os.environ.get('HEALTHCHECK_TOKEN', '')}); urllib.request.urlopen(req).read()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 40s

  nginx:
    image: ghcr.io/sjefferson99/aft-web:latest
    container_name: aft-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - backgrounds_volume:/usr/share/nginx/html/images/backgrounds
    networks:
      - aft

networks:
  aft:
    driver: bridge

volumes:
  backgrounds_volume:
    driver: local

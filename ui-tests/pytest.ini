[pytest]
# UI/E2E suite is kept separate from server/tests: it drives a real browser
# via pytest-playwright and is slower, so it is run on demand with its own
# `pytest` invocation (cd ui-tests && pytest -v) rather than as part of the
# root `pytest -v` run.
testpaths = tests
norecursedirs = .git .venv venv node_modules test-results
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers =
    ui: marks tests as browser-driven UI/E2E tests
